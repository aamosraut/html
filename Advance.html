<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced HTML</title>
</head>
<body>
    <form>
    <!-- Dropdown Selector List -->
    <label for="cars">Choose a car model:</label>
    <select id="cars" name="cars">
        <option value="volvo">Volvo XC90</option>
        <option value="saab">Saab 9-3</option>
        <option value="mercedes">Mercedes E-Class</option>
    </select>

    <br><br>

    <!-- Radio Mutually Exclusive Toggles -->
    <p>Select your preferred updates:</p>
    <input type="radio" id="daily" name="updates" value="daily">
    <label for="daily">Daily Newsletter</label><br>
    <input type="radio" id="weekly" name="updates" value="weekly">
    <label for="weekly">Weekly Summary</label>
</form>

</body>
</html>
