<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Mode Toggle</title>
    <style>
        /* Light Mode Defaults */
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.4s, color 0.4s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Dark Mode overrides applied by JavaScript */
        body.dark-theme {
            background-color: #1e1e24;
            color: #f5f5f5;
        }

        button {
            padding: 12px 24px;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 25px;
            border: 2px solid #333;
            background: transparent;
            color: #333;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        body.dark-theme button {
            border-color: #f5f5f5;
            color: #f5f5f5;
        }
    </style>
</head>
<body>

    <h1>Theme Switcher</h1>
    <p>Click the button below to toggle the background style.</p>
    <button id="theme-button">Switch to Dark Mode</button>

    <script>
        const themeBtn = document.getElementById('theme-button');
        
        themeBtn.addEventListener('click', () => {
            // Toggle the 'dark-theme' class on the <body> tag
            document.body.classList.toggle('dark-theme');
            
            // Change the button text based on the active theme
            if (document.body.classList.contains('dark-theme')) {
                themeBtn.textContent = 'Switch to Light Mode';
            } else {
                themeBtn.textContent = 'Switch to Dark Mode';
            }
        });
    </script>
</body>
</html>
