<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Lightbox</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; padding: 50px; }
        .thumbnail { width: 200px; border-radius: 8px; cursor: pointer; transition: transform 0.2s; }
        .thumbnail:hover { transform: scale(1.05); }
        
        /* Modal Backdrop */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center;
        }
        .modal-content { max-width: 80%; max-height: 80%; border-radius: 4px; }
        .close-btn { position: absolute; top: 20px; right: 30px; color: white; font-size: 40px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Click Image to Expand</h2>
    <img src="https://picsum.photos" class="thumbnail" id="thumb" alt="Sample">

    <div id="modal" class="modal">
        <span class="close-btn" id="close">&times;</span>
        <img class="modal-content" id="modal-img">
    </div>

    <script>
        const modal = document.getElementById('modal');
        const thumb = document.getElementById('thumb');
        const modalImg = document.getElementById('modal-img');
        const close = document.getElementById('close');

        thumb.addEventListener('click', () => {
            modal.style.display = 'flex';
            modalImg.src = thumb.src;
        });

        close.addEventListener('click', () => modal.style.display = 'none');
        modal.addEventListener('click', (e) => { if(e.target === modal) modal.style.display = 'none'; });
    </script>
</body>
</html>
