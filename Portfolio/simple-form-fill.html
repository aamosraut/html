<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Form Validation</title>
</head>
<body>
    <form id="val-form" onsubmit="return validate(event)">
  <input type="text" id="email-field" placeholder="Enter email">
  <button type="submit">Submit</button>
  <div id="error-msg" style="color: red; font-size: 12px; margin-top: 5px;"></div>
</form>
<style>body { font-family: sans-serif; }</style>
<script>
  function validate(e) {
    let email = document.getElementById('email-field').value;
    let err = document.getElementById('error-msg');
    if (!email.includes('@') || !email.includes('.')) {
      e.preventDefault();
      err.innerText = "Invalid email format.";
      return false;
    }
    err.innerText = "";
    alert("Form submitted safely!");
  }
</script>

</body>
</html>
