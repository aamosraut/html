<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabbed Content Toggle</title>
</head>
<body>
    <div class="tabs">
  <button onclick="openTab('Tab1')">Tab 1</button><button onclick="openTab('Tab2')">Tab 2</button>
</div>
<div id="Tab1" class="tab-content" style="display:block;"><h3>Section One</h3><p>Content panel 1.</p></div>
<div id="Tab2" class="tab-content" style="display:none;"><h3>Section Two</h3><p>Content panel 2.</p></div>
<style>
  body { font-family: sans-serif; }
  .tabs button { padding: 10px; cursor: pointer; }
  .tab-content { border: 1px solid #ccc; padding: 15px; margin-top: -1px; width: 250px; }
</style>
<script>
  function openTab(id) {
    document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
    document.getElementById(id).style.display = 'block';
  }
</script>

</body>
</html>
