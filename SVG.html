<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Example</title>
</head>
<body>
    <svg width="200" height="200" viewBox="0 0 100 100" xmlns="http://w3.org">
    <!-- Blue background circle -->
    <circle cx="50" cy="50" r="40" fill="#3498db" />
    <!-- White center star or polygon -->
    <polygon points="50,25 60,40 75,40 62,50 67,65 50,55 33,65 38,50 25,40 40,40" fill="#ffffff" />
</svg>

</body>
</html>
