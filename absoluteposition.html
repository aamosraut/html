<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absolute position</title>
    <style>
        .parent{
            width: 400px;
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }
        .child{
            width: 100px;
            padding: 20px;
            background-color: blue;
            position:absolute;
        }
    </style>
</head>

<body>
    <div class="parents">
        <h2>parents div</h2>

</html>
