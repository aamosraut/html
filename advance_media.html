<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Media</title>
</head>
<body>
    <picture>
    <!-- Use a wide image for desktop views -->
    <source media="(min-width: 1024px)" srcset="hero-large.jpg">
    <!-- Use a smaller cropped image for mobile views -->
    <source media="(min-width: 480px)" srcset="hero-medium.jpg">
    <!-- Fallback if conditions above are not met or if browser is old -->
    <img src="hero-small.jpg" alt="Company hero banner showcasing teamwork" loading="lazy">
</picture>

<!-- Embedded Video with custom user interface settings -->
<video width="100%" controls poster="video-thumbnail.jpg">
    <source src="intro-video.mp4" type="video/mp4">
    <source src="intro-video.webm" type="video/webm">
    Your browser does not support the video tag.
</video>

</body>
</html>
