<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Player</title>
</head>
<body>
    <figure>
    <figcaption>Listen to the Weekly Podcast Interview:</figcaption>
    <audio controls preload="metadata">
        <source src="podcast-episode-45.mp3" type="audio/mpeg">
        <source src="podcast-episode-45.ogg" type="audio/ogg">
        <!-- Subtitles or captions inside the audio -->
        <track kind="captions" src="captions-en.vtt" srclang="en" label="English Captions" default>
        Your browser does not support the audio player element.
    </audio>
</figure>

</body>
</html>
