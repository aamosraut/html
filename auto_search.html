<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Search</title>
</head>
<body>
    <label for="browser-choice">Choose a web browser from the suggestions:</label>
<input list="browsers" id="browser-choice" name="browser-choice">

<datalist id="browsers">
    <option value="Google Chrome">
    </option><option value="Mozilla Firefox">
    </option><option value="Microsoft Edge">
    </option><option value="Apple Safari">
    </option><option value="Opera">
</datalist>

</body>
</html>
