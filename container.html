<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container</title>
</head>
<body>
    <!-- Generic block-level layout box -->
<div style="background-color: #f0f0f0; padding: 20px;">
