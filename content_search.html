<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Search</title>
</head>
<body>
    <label for="framework-search">Select Web Framework:</label>
<input type="search" id="framework-search" name="framework" placeholder="Type a tool name...">

<datalist id="frameworks">
    <optgroup label="Frontend Libraries">
        <option value="React">
        <option value="Vue.js">
        <option value="Angular">
    </optgroup>
    <optgroup label="Backend Tech">
        <option value="Node.js">
        <option value="Django">
        <option value="Laravel">
    </optgroup>
</datalist>

</body>
</html>
