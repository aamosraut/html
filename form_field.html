<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Fields</title>
</head>
<body>
    <!-- Progress bar displays task completion status -->
<p>File Upload Status: 
    <progress id="upload-progress" value="70" max="100">70%</progress>
</p>

<!-- Meter displays disk usage or gauge data inside safe thresholds -->
<p>Server Disk Usage: 
    <meter id="disk-gauge" value="85" min="0" max="100" low="30" high="80" optimum="20">85%</meter>
</p>

</body>
</html>
